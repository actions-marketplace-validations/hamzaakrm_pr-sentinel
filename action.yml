name: "PR Sentinel AI Code Review"
description: "AI pull request reviewer: static analysis (ruff, bandit) + Gemini, Claude, OpenAI or Ollama, posted as inline review comments."
author: "Hamza Akram"
branding:
  icon: "shield"
  color: "blue"

inputs:
  provider:
    description: "LLM provider: gemini | anthropic | openai | ollama | fake"
    required: false
    default: "gemini"
  model:
    description: "Model name. Leave empty to use the provider's default."
    required: false
    default: ""
  gemini-api-key:
    description: "Google Gemini API key (free tier available at aistudio.google.com). Required when provider is gemini."
    required: false
    default: ""
  anthropic-api-key:
    description: "Anthropic API key. Required when provider is anthropic."
    required: false
    default: ""
  openai-api-key:
    description: "OpenAI (or OpenAI-compatible) API key. Required when provider is openai."
    required: false
    default: ""
  min-severity:
    description: "Lowest severity to report: info | low | medium | high | critical"
    required: false
    default: "low"
  fail-on:
    description: "Fail the check if any finding is at or above this severity. Empty = never fail on findings."
    required: false
    default: ""
  github-token:
    description: "Token used to read the pull request and post the review"
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install PR Sentinel
      shell: bash
      run: pip install --quiet "${{ github.action_path }}[static]"

    - name: Run review
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_SENTINEL_PROVIDER: ${{ inputs.provider }}
        PR_SENTINEL_MODEL: ${{ inputs.model }}
        PR_SENTINEL_MIN_SEVERITY: ${{ inputs.min-severity }}
        PR_SENTINEL_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_GEMINI_KEY: ${{ inputs.gemini-api-key }}
        INPUT_ANTHROPIC_KEY: ${{ inputs.anthropic-api-key }}
        INPUT_OPENAI_KEY: ${{ inputs.openai-api-key }}
      run: |
        # Inputs take priority; keys passed via the caller's `env:` still work.
        if [ -n "$INPUT_GEMINI_KEY" ]; then export GEMINI_API_KEY="$INPUT_GEMINI_KEY"; fi
        if [ -n "$INPUT_ANTHROPIC_KEY" ]; then export ANTHROPIC_API_KEY="$INPUT_ANTHROPIC_KEY"; fi
        if [ -n "$INPUT_OPENAI_KEY" ]; then export OPENAI_API_KEY="$INPUT_OPENAI_KEY"; fi
        pr-sentinel github
